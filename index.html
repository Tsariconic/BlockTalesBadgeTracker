<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Tales Badge Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111318;
            color: #f1f1f1;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: min(1100px, 94%);
            margin: 0 auto;
            padding: 35px 0 50px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(28px, 5vw, 44px);
            font-weight: 800;
            letter-spacing: 1px;
        }

        .progress {
            font-size: 20px;
            color: #c9c9c9;
        }

        .progress strong {
            color: white;
        }

        /* Selected badge */

        #selectedSection {
            display: none;
            margin: 30px 0;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: #34373e;
            margin: 18px 0;
        }

        .selected {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 35px;
            align-items: center;
            padding: 10px 20px;
        }

        .selectedIcon {
            width: 200px;
            height: 200px;
            object-fit: contain;
            justify-self: center;
            border-radius: 14px;
        }

        .selectedInfo h2 {
            margin: 0 0 10px;
            font-size: 30px;
        }

        .description {
            color: #bfc2c8;
            line-height: 1.5;
            font-size: 16px;
            margin-bottom: 22px;
        }

        .badgeId {
            color: #777b84;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .checkboxRow {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 17px;
            cursor: pointer;
            user-select: none;
        }

        .checkboxRow input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #6d8cff;
        }

        .status {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .completed {
            color: #75d69c;
        }

        .notCompleted {
            color: #aeb1b8;
        }

        /* Badge grid */

        #badgeGrid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
        }

        .badge {
            position: relative;
            background: #1a1d23;
            border: 1px solid #292c33;
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            transition:
                transform 0.15s ease,
                border-color 0.15s ease,
                background 0.15s ease;
        }

        .badge:hover {
            transform: translateY(-3px);
            border-color: #50555f;
            background: #20232a;
        }

        .badge.selectedBadge {
            border-color: #758cff;
            background: #20243a;
        }

        .badge img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            border-radius: 7px;
        }

        .badge.notOwned img {
            filter: grayscale(100%);
            opacity: 0.42;
        }

        .badge.owned img {
            filter: none;
            opacity: 1;
        }

        .badgeNumber {
            position: absolute;
            top: 7px;
            right: 7px;
            min-width: 22px;
            height: 22px;
            padding: 0 5px;
            border-radius: 11px;
            background: rgba(0, 0, 0, 0.75);
            color: #aaa;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .badge.owned .badgeNumber {
            color: #fff;
        }

        /* Loading / errors */

        .message {
            text-align: center;
            padding: 50px 20px;
            color: #aaa;
        }

        .error {
            color: #ff8585;
        }

        /* Responsive */

        @media (max-width: 800px) {
            #badgeGrid {
                grid-template-columns: repeat(4, 1fr);
            }

            .selected {
                grid-template-columns: 160px 1fr;
                gap: 20px;
            }

            .selectedIcon {
                width: 150px;
                height: 150px;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding-top: 25px;
            }

            #badgeGrid {
                grid-template-columns: repeat(3, 1fr);
                gap: 9px;
            }

            .selected {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .selectedIcon {
                width: 170px;
                height: 170px;
            }

            .checkboxRow {
                justify-content: center;
            }

            .badgeId {
                margin-top: 5px;
            }
        }

        @media (max-width: 400px) {
            #badgeGrid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>BLOCK TALES BADGE TRACKER</h1>

        <div class="progress">
            <strong id="completedCount">0</strong>
            /
            <span id="totalCount">0</span>
            badges
            |
            <strong id="percentage">0%</strong>
        </div>
    </header>

    <!-- Only appears when a badge is selected -->
    <section id="selectedSection">

        <div class="divider"></div>

        <div class="selected">

            <img
                id="selectedIcon"
                class="selectedIcon"
                src=""
                alt=""
            >

            <div class="selectedInfo">

                <h2 id="selectedName"></h2>

                <div id="selectedDescription" class="description"></div>

                <div id="selectedId" class="badgeId"></div>

                <label class="checkboxRow">
                    <input
                        type="checkbox"
                        id="ownedCheckbox"
                    >
                    <span>I have this badge</span>
                </label>

                <div id="selectedStatus" class="status"></div>

            </div>

        </div>

        <div class="divider"></div>

    </section>

    <div id="message" class="message">
        Loading badges...
    </div>

    <div id="badgeGrid"></div>

</div>

<script>

    /*
        ==========================================
        CONFIGURATION
        ==========================================
    */

    const BADGES_FILE = "badges.json";

    const THUMBNAIL_URL =
        "https://thumbnails.roblox.com/v1/badges/icons" +
        "?badgeIds=BADGE_ID" +
        "&size=150x150" +
        "&format=Png" +
        "&isCircular=false";


    /*
        ==========================================
        STATE
        ==========================================
    */

    let badges = [];

    let ownedBadges =
        JSON.parse(localStorage.getItem("blockTalesOwnedBadges") || "[]");

    let selectedBadgeId = null;


    /*
        ==========================================
        DOM
        ==========================================
    */

    const grid = document.getElementById("badgeGrid");
    const message = document.getElementById("message");

    const completedCount =
        document.getElementById("completedCount");

    const totalCount =
        document.getElementById("totalCount");

    const percentage =
        document.getElementById("percentage");

    const selectedSection =
        document.getElementById("selectedSection");

    const selectedIcon =
        document.getElementById("selectedIcon");

    const selectedName =
        document.getElementById("selectedName");

    const selectedDescription =
        document.getElementById("selectedDescription");

    const selectedId =
        document.getElementById("selectedId");

    const ownedCheckbox =
        document.getElementById("ownedCheckbox");

    const selectedStatus =
        document.getElementById("selectedStatus");


    /*
        ==========================================
        LOAD BADGES.JSON
        ==========================================
    */

    async function loadBadges() {

        try {

            const response = await fetch(BADGES_FILE);

            if (!response.ok) {
                throw new Error(
                    "HTTP " + response.status
                );
            }

            const json = await response.json();

            /*
                Supports the exact Roblox API response
                you pasted:

                {
                    "data": [...]
                }

                It also supports a plain array just in case.
            */

            if (Array.isArray(json)) {
                badges = json;
            } else if (Array.isArray(json.data)) {
                badges = json.data;
            } else {
                throw new Error(
                    "badges.json does not contain a data array."
                );
            }

            /*
                Keep the order exactly as it appears
                in badges.json.

                We DO NOT alphabetically sort it.
            */

            totalCount.textContent = badges.length;

            message.style.display = "none";

            renderBadges();
            updateProgress();

        } catch (error) {

            console.error(error);

            message.className = "message error";

            message.innerHTML =
                "<strong>Couldn't load badges.json.</strong><br><br>" +
                "Make sure <b>badges.json</b> is in the same folder " +
                "as index.html.<br><br>" +
                "Error: " +
                escapeHtml(error.message);

        }

    }


    /*
        ==========================================
        ROBLOX THUMBNAIL
        ==========================================
    */

    function getThumbnailUrl(badge) {
        if (!badge.id) {
            return "";
        }

        return THUMBNAIL_URL.replace(
            "BADGE_ID",
            badge.id
        );
    }


    /*
        ==========================================
        RENDER GRID
        ==========================================
    */

    function renderBadges() {

        grid.innerHTML = "";

        badges.forEach((badge, index) => {

            const id = String(badge.id);

            const owned =
                ownedBadges.includes(id);

            const element =
                document.createElement("div");

            element.className =
                "badge " +
                (owned ? "owned" : "notOwned");

            element.dataset.id = id;

            if (selectedBadgeId === id) {
                element.classList.add("selectedBadge");
            }

            const img =
                document.createElement("img");

            img.src = getThumbnailUrl(badge);

            img.alt =
                badge.displayName ||
                badge.name ||
                "Badge";

            img.loading = "lazy";

            /*
                If Roblox doesn't return an icon,
                don't let the broken-image icon look awful.
            */

            img.onerror = function () {
                this.style.opacity = "0.2";
            };

            const number =
                document.createElement("div");

            number.className = "badgeNumber";

            number.textContent = index + 1;

            element.appendChild(img);
            element.appendChild(number);

            element.addEventListener(
                "click",
                () => selectBadge(badge)
            );

            grid.appendChild(element);

        });

    }


    /*
        ==========================================
        SELECT BADGE
        ==========================================
    */

    function selectBadge(badge) {

        selectedBadgeId =
            String(badge.id);

        selectedSection.style.display =
            "block";

        selectedIcon.src =
            getThumbnailUrl(badge);

        selectedIcon.alt =
            badge.displayName ||
            badge.name ||
            "Badge";

        selectedName.textContent =
            badge.displayName ||
            badge.name ||
            "Unnamed Badge";

        selectedDescription.textContent =
            badge.displayDescription ??
            badge.description ??
            "No description.";

        selectedId.textContent =
            "Badge ID: " + badge.id;

        ownedCheckbox.checked =
            ownedBadges.includes(
                String(badge.id)
            );

        updateSelectedStatus();

        renderBadges();

        /*
            Scroll the selected badge area
            into view on mobile / long pages.
        */

        selectedSection.scrollIntoView({
            behavior: "smooth",
            block: "nearest"
        });

    }


    /*
        ==========================================
        CHECKBOX
        ==========================================
    */

    ownedCheckbox.addEventListener(
        "change",
        function () {

            if (!selectedBadgeId) {
                return;
            }

            if (this.checked) {

                if (!ownedBadges.includes(
                    selectedBadgeId
                )) {

                    ownedBadges.push(
                        selectedBadgeId
                    );

                }

            } else {

                ownedBadges =
                    ownedBadges.filter(
                        id => id !== selectedBadgeId
                    );

            }

            localStorage.setItem(
                "blockTalesOwnedBadges",
                JSON.stringify(ownedBadges)
            );

            updateProgress();
            updateSelectedStatus();
            renderBadges();

        }
    );


    /*
        ==========================================
        PROGRESS
        ==========================================
    */

    function updateProgress() {

        /*
            Only count badges which actually
            exist in the current badges.json.

            This prevents old saved IDs from
            affecting the percentage if you
            remove/update badges later.
        */

        const completed =
            badges.filter(
                badge =>
                    ownedBadges.includes(
                        String(badge.id)
                    )
            ).length;

        const total =
            badges.length;

        const percent =
            total === 0
                ? 0
                : (completed / total) * 100;

        completedCount.textContent =
            completed;

        totalCount.textContent =
            total;

        percentage.textContent =
            formatPercentage(percent);

    }


    function formatPercentage(number) {

        /*
            23 / 70 = 32.9%
            1 / 3 = 33.3%
            70 / 70 = 100%
        */

        if (Number.isInteger(number)) {
            return number + "%";
        }

        return number.toFixed(1) + "%";

    }


    /*
        ==========================================
        SELECTED STATUS
        ==========================================
    */

    function updateSelectedStatus() {

        if (!selectedBadgeId) {
            return;
        }

        if (ownedCheckbox.checked) {

            selectedStatus.textContent =
                "COMPLETED";

            selectedStatus.className =
                "status completed";

        } else {

            selectedStatus.textContent =
                "NOT COMPLETED";

            selectedStatus.className =
                "status notCompleted";

        }

    }


    /*
        ==========================================
        HTML ESCAPING
        ==========================================
    */

    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent =
            String(text);

        return div.innerHTML;

    }


    /*
        ==========================================
        START
        ==========================================
    */

    loadBadges();

</script>

</body>
</html>

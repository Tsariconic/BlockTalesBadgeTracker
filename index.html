
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Block Tales Badge Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b0b0f;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        .container {
            width: min(1100px, calc(100% - 32px));
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 55px 0 35px;
        }

        header h1 {
            margin: 0;
            font-size: clamp(32px, 6vw, 56px);
            font-weight: 800;
            letter-spacing: -1.5px;
        }

        header p {
            margin: 12px 0 0;
            color: #9999a6;
            font-size: 16px;
        }

        #searchSection {
            max-width: 600px;
            margin: 30px auto 70px;
        }

        .searchBox {
            display: flex;
            gap: 10px;
        }

        #usernameInput {
            flex: 1;
            min-width: 0;
            padding: 16px 18px;
            border: 1px solid #292930;
            border-radius: 12px;
            outline: none;
            background: #15151b;
            color: white;
            transition: border-color 0.2s;
        }

        #usernameInput:focus {
            border-color: #666673;
        }

        #usernameInput::placeholder {
            color: #777783;
        }

        #searchButton,
        #backButton {
            border: 0;
            border-radius: 12px;
            padding: 0 22px;
            background: white;
            color: black;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
        }

        #searchButton:hover,
        #backButton:hover {
            transform: translateY(-1px);
        }

        #searchButton:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        #error {
            margin-top: 12px;
            padding: 12px;
            border-radius: 10px;
            background: #291416;
            color: #ff9da3;
            display: none;
            text-align: center;
        }

        #loading {
            display: none;
            text-align: center;
            color: #aaaab4;
            padding: 40px 0;
        }

        #tracker {
            display: none;
            padding-bottom: 60px;
        }

        .trackerTop {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
        }

        .progressInfo h2 {
            margin: 0;
            font-size: 28px;
        }

        .progressInfo p {
            margin: 7px 0 0;
            color: #9999a6;
        }

        #backButton {
            height: 44px;
        }

        .progressBar {
            width: 100%;
            height: 8px;
            margin-bottom: 30px;
            overflow: hidden;
            border-radius: 20px;
            background: #202027;
        }

        #progressFill {
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: white;
            transition: width 0.5s ease;
        }

        #badgeGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
            gap: 16px;
        }

        .badgeCard {
            position: relative;
            min-width: 0;
            padding: 16px;
            border: 1px solid #24242c;
            border-radius: 15px;
            background: #111117;
            cursor: pointer;
            transition: transform 0.18s, border-color 0.18s, background 0.18s;
        }

        .badgeCard:hover {
            transform: translateY(-4px);
            border-color: #454550;
            background: #16161d;
        }

        .badgeImageWrapper {
            width: 100%;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            border-radius: 10px;
            overflow: hidden;
        }

        .badgeImage {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: filter 0.25s;
        }

        .badgeImage.locked {
            filter: grayscale(1) brightness(0.45);
        }

        .badgeName {
            font-size: 14px;
            line-height: 1.3;
            font-weight: 700;
            text-align: center;
            word-break: break-word;
        }

        .status {
            margin-top: 7px;
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .status.completed {
            color: #8be28b;
        }

        .status.locked {
            color: #777783;
        }

        /* Modal */

        #modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(7px);
        }

        .modalContent {
            position: relative;
            width: min(500px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            padding: 35px;
            border: 1px solid #2d2d36;
            border-radius: 20px;
            background: #111117;
            text-align: center;
        }

        #closeModal {
            position: absolute;
            top: 12px;
            right: 15px;
            width: 35px;
            height: 35px;
            border: 0;
            border-radius: 50%;
            background: #24242c;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        #modalIcon {
            width: 220px;
            height: 220px;
            object-fit: contain;
            margin: 5px auto 20px;
        }

        #modalName {
            margin: 0;
            font-size: 27px;
        }

        #modalDescription {
            margin: 12px 0 20px;
            color: #a7a7b3;
            line-height: 1.5;
        }

        #modalStatus {
            display: inline-block;
            padding: 9px 15px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 800;
        }

        #modalStatus.completed {
            background: #14351d;
            color: #8be28b;
        }

        #modalStatus.locked {
            background: #29292f;
            color: #9999a6;
        }

        @media (max-width: 600px) {
            .container {
                width: min(100% - 20px, 1100px);
            }

            header {
                padding-top: 35px;
            }

            .searchBox {
                flex-direction: column;
            }

            #searchButton {
                height: 50px;
            }

            .trackerTop {
                align-items: flex-start;
                flex-direction: column;
            }

            #backButton {
                width: 100%;
            }

            #badgeGrid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .badgeCard {
                padding: 10px;
            }

            .modalContent {
                padding: 25px 20px;
            }

            #modalIcon {
                width: 180px;
                height: 180px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>Block Tales Badge Tracker</h1>
        <p>Track your progress through every Block Tales badge.</p>
    </header>

    <section id="searchSection">
        <div class="searchBox">
            <input
                id="usernameInput"
                type="text"
                placeholder="Enter your username"
                autocomplete="off"
            >

            <button id="searchButton">
                Search
            </button>
        </div>

        <div id="error"></div>
    </section>

    <div id="loading">
        Loading badges...
    </div>

    <section id="tracker">

        <div class="trackerTop">

            <div class="progressInfo">
                <h2 id="progressText">0 / 0 badges (0%)</h2>
                <p id="userText"></p>
            </div>

            <button id="backButton">
                Search another user
            </button>

        </div>

        <div class="progressBar">
            <div id="progressFill"></div>
        </div>

        <div id="badgeGrid"></div>

    </section>

</div>

<!-- Badge modal -->

<div id="modal">

    <div class="modalContent">

        <button id="closeModal">&times;</button>

        <img id="modalIcon" src="" alt="Badge icon">

        <h2 id="modalName"></h2>

        <p id="modalDescription"></p>

        <div id="modalStatus"></div>

    </div>

</div>

<script>

    /*
     * ============================
     * CONFIGURATION
     * ============================
     */

    const WORKER_URL = "https://YOUR-WORKER-NAME.YOUR-SUBDOMAIN.workers.dev";

    /*
     * Your Block Tales universe.
     */

    const UNIVERSE_ID = "5678284602";


    /*
     * ============================
     * ELEMENTS
     * ============================
     */

    const usernameInput = document.getElementById("usernameInput");
    const searchButton = document.getElementById("searchButton");
    const searchSection = document.getElementById("searchSection");
    const loading = document.getElementById("loading");
    const tracker = document.getElementById("tracker");
    const badgeGrid = document.getElementById("badgeGrid");
    const progressText = document.getElementById("progressText");
    const progressFill = document.getElementById("progressFill");
    const userText = document.getElementById("userText");
    const errorBox = document.getElementById("error");

    const modal = document.getElementById("modal");
    const modalIcon = document.getElementById("modalIcon");
    const modalName = document.getElementById("modalName");
    const modalDescription = document.getElementById("modalDescription");
    const modalStatus = document.getElementById("modalStatus");
    const closeModal = document.getElementById("closeModal");
    const backButton = document.getElementById("backButton");


    /*
     * ============================
     * HELPERS
     * ============================
     */

    function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = "block";
    }

    function hideError() {
        errorBox.style.display = "none";
    }

    function setLoading(value) {
        loading.style.display = value ? "block" : "none";
        searchButton.disabled = value;
    }


    /*
     * ============================
     * SEARCH
     * ============================
     */

    async function searchUser() {

        const username = usernameInput.value.trim();

        if (!username) {
            showError("Please enter a Roblox username.");
            return;
        }

        hideError();
        setLoading(true);

        try {

            /*
             * Ask our Cloudflare Worker to do all
             * Roblox API requests.
             */

            const response = await fetch(
                `${WORKER_URL}/track?username=${encodeURIComponent(username)}&universeId=${UNIVERSE_ID}`
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Something went wrong.");
            }

            if (!data.user) {
                throw new Error("Roblox user not found.");
            }

            displayResults(data);

        } catch (error) {

            console.error(error);

            showError(
                error.message ||
                "Unable to load this Roblox user."
            );

        } finally {

            setLoading(false);

        }
    }


    /*
     * ============================
     * DISPLAY RESULTS
     * ============================
     */

    function displayResults(data) {

        searchSection.style.display = "none";
        loading.style.display = "none";
        tracker.style.display = "block";

        badgeGrid.innerHTML = "";

        const badges = data.badges || [];

        const completedCount = badges.filter(
            badge => badge.completed
        ).length;

        const total = badges.length;

        const percentage = total === 0
            ? 0
            : Math.round((completedCount / total) * 100);

        progressText.textContent =
            `${completedCount} / ${total} badges (${percentage}%)`;

        userText.textContent =
            `Showing badges for ${data.user.name}`;

        progressFill.style.width =
            `${percentage}%`;

        /*
         * Sort completed badges first.
         */

        badges.sort((a, b) => {

            if (a.completed !== b.completed) {
                return a.completed ? -1 : 1;
            }

            return a.name.localeCompare(b.name);

        });

        for (const badge of badges) {

            const card = document.createElement("div");
            card.className = "badgeCard";

            const imageWrapper = document.createElement("div");
            imageWrapper.className = "badgeImageWrapper";

            const image = document.createElement("img");
            image.className = "badgeImage";

            if (!badge.completed) {
                image.classList.add("locked");
            }

            image.src = badge.iconUrl;
            image.alt = badge.name;

            /*
             * Prevent broken images from looking ugly.
             */

            image.onerror = () => {
                image.style.opacity = "0.2";
            };

            imageWrapper.appendChild(image);

            const name = document.createElement("div");
            name.className = "badgeName";
            name.textContent = badge.name;

            const status = document.createElement("div");
            status.className =
                badge.completed
                    ? "status completed"
                    : "status locked";

            status.textContent =
                badge.completed
                    ? "COMPLETED"
                    : "NOT COMPLETED";

            card.appendChild(imageWrapper);
            card.appendChild(name);
            card.appendChild(status);

            card.addEventListener("click", () => {
                openModal(badge);
            });

            badgeGrid.appendChild(card);
        }
    }


    /*
     * ============================
     * MODAL
     * ============================
     */

    function openModal(badge) {

        modalIcon.src = badge.iconUrl;
        modalName.textContent = badge.name;

        modalDescription.textContent =
            badge.description ||
            "No description available.";

        modalStatus.textContent =
            badge.completed
                ? "COMPLETED"
                : "NOT COMPLETED";

        modalStatus.className =
            badge.completed
                ? "completed"
                : "locked";

        modal.style.display = "flex";
    }


    function closeBadgeModal() {
        modal.style.display = "none";
    }


    closeModal.addEventListener(
        "click",
        closeBadgeModal
    );


    modal.addEventListener("click", event => {

        if (event.target === modal) {
            closeBadgeModal();
        }

    });


    document.addEventListener("keydown", event => {

        if (event.key === "Escape") {
            closeBadgeModal();
        }

    });


    /*
     * ============================
     * SEARCH ANOTHER USER
     * ============================
     */

    backButton.addEventListener("click", () => {

        tracker.style.display = "none";
        searchSection.style.display = "block";

        usernameInput.value = "";
        usernameInput.focus();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    });


    /*
     * ============================
     * BUTTON / ENTER KEY
     * ============================
     */

    searchButton.addEventListener(
        "click",
        searchUser
    );

    usernameInput.addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                searchUser();
            }

        }
    );

</script>

</body>
</html>

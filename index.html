<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Tales Badge Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111318;
            color: #f1f1f1;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: min(1100px, 94%);
            margin: 0 auto;
            padding: 35px 0 50px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(28px, 5vw, 44px);
            font-weight: 800;
            letter-spacing: 1px;
        }

        .progress {
            font-size: 20px;
            color: #c9c9c9;
        }

        .progress strong {
            color: white;
        }

        #selectedSection {
            display: none;
            margin: 30px 0;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: #34373e;
            margin: 18px 0;
        }

        .selected {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 35px;
            align-items: center;
            padding: 10px 20px;
        }

        .selectedIcon {
            width: 200px;
            height: 200px;
            object-fit: contain;
            justify-self: center;
            border-radius: 14px;
        }

        .selectedInfo h2 {
            margin: 0 0 10px;
            font-size: 30px;
        }

        .description {
            color: #bfc2c8;
            line-height: 1.5;
            font-size: 16px;
            margin-bottom: 22px;
        }

        .badgeId {
            color: #777b84;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .checkboxRow {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 17px;
            cursor: pointer;
            user-select: none;
        }

        .checkboxRow input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #6d8cff;
        }

        .status {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .completed {
            color: #75d69c;
        }

        .notCompleted {
            color: #aeb1b8;
        }

        #badgeGrid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
        }

        .badge {
            position: relative;
            background: #1a1d23;
            border: 1px solid #292c33;
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            transition:
                transform 0.15s ease,
                border-color 0.15s ease,
                background 0.15s ease;
        }

        .badge:hover {
            transform: translateY(-3px);
            border-color: #50555f;
            background: #20232a;
        }

        .badge.selectedBadge {
            border-color: #758cff;
            background: #20243a;
        }

        .badge img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            border-radius: 7px;
        }

        .badge.notOwned img {
            filter: grayscale(100%);
            opacity: 0.42;
        }

        .badge.owned img {
            filter: none;
            opacity: 1;
        }

        .badgeNumber {
            position: absolute;
            top: 7px;
            right: 7px;
            min-width: 22px;
            height: 22px;
            padding: 0 5px;
            border-radius: 11px;
            background: rgba(0, 0, 0, 0.75);
            color: #aaa;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .badge.owned .badgeNumber {
            color: #fff;
        }

        .message {
            text-align: center;
            padding: 50px 20px;
            color: #aaa;
        }

        .error {
            color: #ff8585;
        }

        @media (max-width: 800px) {
            #badgeGrid {
                grid-template-columns: repeat(4, 1fr);
            }

            .selected {
                grid-template-columns: 160px 1fr;
                gap: 20px;
            }

            .selectedIcon {
                width: 150px;
                height: 150px;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding-top: 25px;
            }

            #badgeGrid {
                grid-template-columns: repeat(3, 1fr);
                gap: 9px;
            }

            .selected {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .selectedIcon {
                width: 170px;
                height: 170px;
            }

            .checkboxRow {
                justify-content: center;
            }

            .badgeId {
                margin-top: 5px;
            }
        }

        @media (max-width: 400px) {
            #badgeGrid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>BLOCK TALES BADGE TRACKER</h1>

        <div class="progress">
            <strong id="completedCount">0</strong>
            /
            <span id="totalCount">0</span>
            badges
            |
            <strong id="percentage">0%</strong>
        </div>
    </header>

    <section id="selectedSection">

        <div class="divider"></div>

        <div class="selected">

            <img
                id="selectedIcon"
                class="selectedIcon"
                src=""
                alt=""
            >

            <div class="selectedInfo">

                <h2 id="selectedName"></h2>

                <div
                    id="selectedDescription"
                    class="description"
                ></div>

                <div
                    id="selectedId"
                    class="badgeId"
                ></div>

                <label class="checkboxRow">

                    <input
                        type="checkbox"
                        id="ownedCheckbox"
                    >

                    <span>I have this badge</span>

                </label>

                <div
                    id="selectedStatus"
                    class="status"
                ></div>

            </div>

        </div>

        <div class="divider"></div>

    </section>

    <div id="message" class="message">
        Loading badges...
    </div>

    <div id="badgeGrid"></div>

</div>

<script>

    /*
        ==========================================
        CONFIGURATION
        ==========================================
    */

    const BADGES_FILE = "badges.json";
    const IMAGES_FILE = "images.json";


    /*
        ==========================================
        STATE
        ==========================================
    */

    let badges = [];

    let imageMap = new Map();

    let ownedBadges =
        JSON.parse(
            localStorage.getItem(
                "blockTalesOwnedBadges"
            ) || "[]"
        );

    let selectedBadgeId = null;


    /*
        ==========================================
        DOM
        ==========================================
    */

    const grid =
        document.getElementById("badgeGrid");

    const message =
        document.getElementById("message");

    const completedCount =
        document.getElementById("completedCount");

    const totalCount =
        document.getElementById("totalCount");

    const percentage =
        document.getElementById("percentage");

    const selectedSection =
        document.getElementById("selectedSection");

    const selectedIcon =
        document.getElementById("selectedIcon");

    const selectedName =
        document.getElementById("selectedName");

    const selectedDescription =
        document.getElementById("selectedDescription");

    const selectedId =
        document.getElementById("selectedId");

    const ownedCheckbox =
        document.getElementById("ownedCheckbox");

    const selectedStatus =
        document.getElementById("selectedStatus");


    /*
        ==========================================
        LOAD IMAGES.JSON
        ==========================================
    */

    async function loadImages() {

        const response =
            await fetch(IMAGES_FILE);

        if (!response.ok) {

            throw new Error(
                "Could not load images.json. HTTP " +
                response.status
            );

        }

        const json =
            await response.json();


        /*
            images.json has this structure:

            {
                "data": [
                    {
                        "targetId": 123,
                        "state": "Completed",
                        "imageUrl": "...",
                        "version": "TN3"
                    }
                ]
            }
        */

        if (
            !json ||
            !Array.isArray(json.data)
        ) {

            throw new Error(
                "images.json does not contain a data array."
            );

        }


        /*
            Turn the array into a Map.

            targetId -> imageUrl

            This makes lookups extremely fast.
        */

        imageMap = new Map();

        json.data.forEach(
            image => {

                if (
                    image.targetId === undefined ||
                    image.targetId === null
                ) {

                    return;

                }


                imageMap.set(
                    String(image.targetId),
                    image.imageUrl || ""
                );

            }
        );


        console.log(
            "Loaded " +
            imageMap.size +
            " image URLs from images.json."
        );

    }


    /*
        ==========================================
        GET THUMBNAIL URL
        ==========================================
    */

    function getThumbnailUrl(badge) {

        if (
            !badge ||
            badge.id === undefined ||
            badge.id === null
        ) {

            return "";

        }


        const id =
            String(badge.id);


        /*
            Find the image associated with
            this badge ID.

            IMPORTANT:

            There are NO Roblox API requests here.

            The URL comes directly from images.json.
        */

        return imageMap.get(id) || "";

    }


    /*
        ==========================================
        LOAD BADGES.JSON
        ==========================================
    */

    async function loadBadges() {

        try {

            /*
                Load both JSON files before
                rendering anything.
            */

            await loadImages();


            const response =
                await fetch(BADGES_FILE);

            if (!response.ok) {

                throw new Error(
                    "HTTP " + response.status
                );

            }

            const json =
                await response.json();


            /*
                Support:

                {
                    "data": [...]
                }

                OR:

                [...]
            */

            if (Array.isArray(json)) {

                badges = json;

            } else if (
                Array.isArray(json.data)
            ) {

                badges = json.data;

            } else {

                throw new Error(
                    "badges.json does not contain a data array."
                );

            }


            totalCount.textContent =
                badges.length;


            message.style.display =
                "none";


            /*
                Render the grid once.
            */

            renderBadges();

            updateProgress();

        } catch (error) {

            console.error(error);

            message.className =
                "message error";

            message.innerHTML =
                "<strong>Couldn't load badge data.</strong><br><br>" +
                "Make sure <b>badges.json</b> and <b>images.json</b> " +
                "are in the same folder as index.html.<br><br>" +
                "Error: " +
                escapeHtml(error.message);

        }

    }


    /*
        ==========================================
        RENDER BADGES
        ==========================================
    */

    function renderBadges() {

        grid.innerHTML = "";


        /*
            No Roblox requests happen here.

            getThumbnailUrl() simply looks up
            the URL in the imageMap.
        */

        badges.forEach(
            (badge, index) => {

                const id =
                    String(badge.id);

                const owned =
                    ownedBadges.includes(id);


                const element =
                    document.createElement("div");


                element.className =
                    "badge " +
                    (
                        owned
                            ? "owned"
                            : "notOwned"
                    );


                element.dataset.id =
                    id;


                if (
                    selectedBadgeId === id
                ) {

                    element.classList.add(
                        "selectedBadge"
                    );

                }


                /*
                    Badge image
                */

                const img =
                    document.createElement("img");


                const imageUrl =
                    getThumbnailUrl(badge);


                if (imageUrl) {

                    img.src =
                        imageUrl;

                }


                img.alt =
                    badge.displayName ||
                    badge.name ||
                    "Badge";


                img.loading =
                    "lazy";


                img.onerror =
                    function () {

                        this.style.opacity =
                            "0.2";

                    };


                /*
                    Badge number
                */

                const number =
                    document.createElement("div");


                number.className =
                    "badgeNumber";


                number.textContent =
                    index + 1;


                element.appendChild(img);
                element.appendChild(number);


                /*
                    Clicking a badge only changes
                    the selected badge.

                    The grid is NOT rebuilt.
                */

                element.addEventListener(
                    "click",
                    () => selectBadge(badge)
                );


                grid.appendChild(element);

            }
        );

    }


    /*
        ==========================================
        SELECT BADGE
        ==========================================
    */

    function selectBadge(badge) {

        selectedBadgeId =
            String(badge.id);


        selectedSection.style.display =
            "block";


        /*
            Get the image directly from
            images.json.

            No network request is made.
        */

        const imageUrl =
            getThumbnailUrl(badge);


        selectedIcon.src =
            imageUrl;


        selectedIcon.alt =
            badge.displayName ||
            badge.name ||
            "Badge";


        selectedName.textContent =
            badge.displayName ||
            badge.name ||
            "Unnamed Badge";


        selectedDescription.textContent =
            badge.displayDescription ??
            badge.description ??
            "No description.";


        selectedId.textContent =
            "Badge ID: " +
            badge.id;


        ownedCheckbox.checked =
            ownedBadges.includes(
                String(badge.id)
            );


        updateSelectedStatus();
        updateSelectedBadgeVisuals();


        selectedSection.scrollIntoView({
            behavior: "smooth",
            block: "nearest"
        });

    }


    /*
        ==========================================
        UPDATE SELECTED BADGE VISUAL
        ==========================================
    */

    function updateSelectedBadgeVisuals() {

        const badgeElements =
            grid.querySelectorAll(".badge");


        badgeElements.forEach(
            element => {

                if (
                    element.dataset.id ===
                    selectedBadgeId
                ) {

                    element.classList.add(
                        "selectedBadge"
                    );

                } else {

                    element.classList.remove(
                        "selectedBadge"
                    );

                }

            }
        );

    }


    /*
        ==========================================
        CHECKBOX
        ==========================================
    */

    ownedCheckbox.addEventListener(
        "change",
        function () {

            if (!selectedBadgeId) {
                return;
            }


            if (this.checked) {

                if (
                    !ownedBadges.includes(
                        selectedBadgeId
                    )
                ) {

                    ownedBadges.push(
                        selectedBadgeId
                    );

                }

            } else {

                ownedBadges =
                    ownedBadges.filter(
                        id =>
                            id !==
                            selectedBadgeId
                    );

            }


            /*
                Save ownership.
            */

            localStorage.setItem(
                "blockTalesOwnedBadges",
                JSON.stringify(
                    ownedBadges
                )
            );


            /*
                Only update the affected
                parts of the page.
            */

            updateProgress();
            updateSelectedStatus();
            updateOwnedBadgeVisual();

        }
    );


    /*
        ==========================================
        UPDATE OWNED BADGE VISUAL
        ==========================================
    */

    function updateOwnedBadgeVisual() {

        const badgeElement =
            grid.querySelector(
                '.badge[data-id="' +
                selectedBadgeId +
                '"]'
            );


        if (!badgeElement) {
            return;
        }


        if (ownedCheckbox.checked) {

            badgeElement.classList.remove(
                "notOwned"
            );

            badgeElement.classList.add(
                "owned"
            );

        } else {

            badgeElement.classList.remove(
                "owned"
            );

            badgeElement.classList.add(
                "notOwned"
            );

        }

    }


    /*
        ==========================================
        PROGRESS
        ==========================================
    */

    function updateProgress() {

        const completed =
            badges.filter(
                badge =>
                    ownedBadges.includes(
                        String(badge.id)
                    )
            ).length;


        const total =
            badges.length;


        const percent =
            total === 0
                ? 0
                : (completed / total) * 100;


        completedCount.textContent =
            completed;


        totalCount.textContent =
            total;


        percentage.textContent =
            formatPercentage(percent);

    }


    function formatPercentage(number) {

        if (Number.isInteger(number)) {

            return number + "%";

        }

        return number.toFixed(1) + "%";

    }


    /*
        ==========================================
        SELECTED STATUS
        ==========================================
    */

    function updateSelectedStatus() {

        if (!selectedBadgeId) {
            return;
        }


        if (ownedCheckbox.checked) {

            selectedStatus.textContent =
                "COMPLETED";


            selectedStatus.className =
                "status completed";

        } else {

            selectedStatus.textContent =
                "NOT COMPLETED";


            selectedStatus.className =
                "status notCompleted";

        }

    }


    /*
        ==========================================
        HTML ESCAPING
        ==========================================
    */

    function escapeHtml(text) {

        const div =
            document.createElement("div");


        div.textContent =
            String(text);


        return div.innerHTML;

    }


    /*
        ==========================================
        START
        ==========================================
    */

    loadBadges();

</script>

</body>
</html>
